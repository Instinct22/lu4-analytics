name: Docker Publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        type: string

env:
  REGISTRY: liiiiiiiiis
  IMAGE_PREFIX: lu4-analytics

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'database/**'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker-publish.yml'
            nginx:
              - 'nginx/**'
              - 'data/**'
              - '.github/workflows/docker-publish.yml'

      - name: Set build matrix
        id: set-matrix
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          NGINX: ${{ steps.filter.outputs.nginx }}
        run: |
          items=()
          add() {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$4" = "true" ]; then
              items+=("{\"name\":\"$1\",\"context\":\"$2\",\"file\":\"$3\"}")
            fi
          }
          add backend . backend/Dockerfile.prod "$BACKEND"
          add frontend frontend frontend/Dockerfile "$FRONTEND"
          add nginx . nginx/Dockerfile "$NGINX"
          if [ ${#items[@]} -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)) &&
      needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$EVENT" in
            pull_request)
              echo "tags=${IMAGE}:branch-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tags=${IMAGE}:${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
