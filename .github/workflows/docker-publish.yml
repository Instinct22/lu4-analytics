name: Docker Publish

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        type: string

env:
  REGISTRY: liiiiiiiiis
  IMAGE_PREFIX: lu4-analytics

jobs:
  changes:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'database/**'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker-publish.yml'
            nginx:
              - 'nginx/**'
              - 'data/**'
              - '.github/workflows/docker-publish.yml'

      - name: Set build matrix
        id: set-matrix
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          NGINX: ${{ steps.filter.outputs.nginx }}
        run: |
          items=()
          add() {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$4" = "true" ]; then
              items+=("{\"name\":\"$1\",\"context\":\"$2\",\"file\":\"$3\"}")
            fi
          }
          add backend . backend/Dockerfile.prod "$BACKEND"
          add frontend frontend frontend/Dockerfile "$FRONTEND"
          add nginx . nginx/Dockerfile "$NGINX"
          if [ ${#items[@]} -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository)) &&
      needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$EVENT" in
            pull_request)
              echo "tags=${IMAGE}:branch-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tags=${IMAGE}:${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: lu4-production
      cancel-in-progress: false
    steps:
      - name: Deploy to production and check application health
        env:
          DEPLOY_KEY: ${{ secrets.LU4_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          mkdir -p ~/.ssh
          printf '%s\n' '31.76.69.197 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKuiqKdKlng6V6Z+QV+0lZ9d9bejbsj1+9vFZ+JDizaLRieDXZiuN5zkSUFebiM/LklfrcqJ19xxkgDfuXBhgX8=' > ~/.ssh/lu4_known_hosts
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/lu4_known_hosts root@31.76.69.197 deploy

  cleanup-pr-tags:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "number=${PR_FROM_EVENT}" >> "$GITHUB_OUTPUT"
          else
            number=$(echo "$COMMIT_MSG" | sed -n 's/.*(#\([0-9][0-9]*\)).*/\1/p' | head -1)
            if [ -z "$number" ]; then
              number=$(echo "$COMMIT_MSG" | sed -n 's/Merge pull request #\([0-9][0-9]*\).*/\1/p')
            fi
            if [ -z "$number" ]; then
              echo "No PR number in commit message — skip cleanup"
              echo "number=" >> "$GITHUB_OUTPUT"
            else
              echo "number=${number}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Delete branch-* tags from Docker Hub
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          tag="branch-${PR_NUMBER}"
          for svc in backend frontend nginx; do
            img="${REGISTRY}/${IMAGE_PREFIX}-${svc}:${tag}"
            if ! crane manifest "$img" >/dev/null 2>&1; then
              echo "${img} -> not found (skipped)"
              continue
            fi
            if crane delete "$img"; then
              echo "${img} -> deleted"
            else
              echo "${img} -> delete failed" >&2
              exit 1
            fi
          done
