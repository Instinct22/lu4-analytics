services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lu4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lu4secret}
      POSTGRES_DB: ${POSTGRES_DB:-lu4}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lu4} -d ${POSTGRES_DB:-lu4}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: ${DOCKER_REGISTRY:-liiiiiiiiis}/${DOCKER_IMAGE_PREFIX:-lu4-analytics}-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_data:/data
      - media_uploads:/data/media:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/data/datasets/items_encyclopedia.json"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  backend:
    image: ${DOCKER_REGISTRY:-liiiiiiiiis}/${DOCKER_IMAGE_PREFIX:-lu4-analytics}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lu4}:${POSTGRES_PASSWORD:-lu4secret}@db:5432/${POSTGRES_DB:-lu4}
      WIKI_PATH: /data/wiki
      DATASETS_PATH: /data/datasets
      MEDIA_PATH: /data/media
      PYTHONPATH: /app
      DEV_RELOAD: "false"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - static_data:/data:ro
      - media_uploads:/data/media
    depends_on:
      db:
        condition: service_healthy
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s

  frontend:
    image: ${DOCKER_REGISTRY:-liiiiiiiiis}/${DOCKER_IMAGE_PREFIX:-lu4-analytics}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  static_data:
  media_uploads:
