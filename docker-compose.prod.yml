services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lu4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lu4secret}
      POSTGRES_DB: ${POSTGRES_DB:-lu4}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lu4} -d ${POSTGRES_DB:-lu4}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lu4}:${POSTGRES_PASSWORD:-lu4secret}@db:5432/${POSTGRES_DB:-lu4}
      WIKI_PATH: /data/wiki
      DATASETS_PATH: /data/datasets
      MEDIA_PATH: /data/media
      PYTHONPATH: /app
      DEV_RELOAD: "false"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      # library/raw is only read to (re)parse NPC loot on import; requests are
      # served from npc_loot, so it can be left out of the deploy archive.
      - ./data/wiki:/data/wiki:ro
      - ./data/datasets:/data/datasets:ro
      - ./data/raid-bosses:/data/raid-bosses:ro
      - ./data/media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/wiki:/data/wiki:ro
      - ./data/media:/data/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
