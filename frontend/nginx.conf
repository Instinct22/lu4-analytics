gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/javascript
    text/plain;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite writes a content hash into every asset name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ assets keep their names, so revalidate rather than pin forever.
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri /index.html;
    }

    # SPA: do not use $uri/ — a public/ folder matching a React route
    # (e.g. /raid-bosses) would otherwise 403 on directory index.
    location / {
        try_files $uri /index.html;
    }
}
