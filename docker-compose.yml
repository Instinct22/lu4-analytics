# Локальная разработка: сборка из исходников, без pull с Docker Hub.
# Запуск:  docker compose up -d --build
# Обновление после правок кода:  .\scripts\docker-dev.ps1 update
# или:  docker compose up -d --build frontend   (только UI)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lu4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lu4secret}
      POSTGRES_DB: ${POSTGRES_DB:-lu4}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lu4} -d ${POSTGRES_DB:-lu4}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/wiki:/data/wiki:ro
      - ./data/datasets:/data/datasets:ro
      - ./data/raid-bosses:/data/raid-bosses:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/data/datasets/items_encyclopedia.json"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: lu4-analytics-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lu4}:${POSTGRES_PASSWORD:-lu4secret}@db:5432/${POSTGRES_DB:-lu4}
      WIKI_PATH: /data/wiki
      DATASETS_PATH: /data/datasets
      PYTHONPATH: /app
      DEV_RELOAD: ${DEV_RELOAD:-true}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
      - ./database:/database
      - ./data/wiki:/data/wiki:ro
      - ./data/datasets:/data/datasets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lu4-analytics-frontend:local
    restart: unless-stopped
    depends_on:
      - backend

  # Hot-reload UI без пересборки образа (profile dev):
  #   docker compose --profile dev up -d
  # Открыть http://localhost:5173
  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://nginx:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - nginx
      - backend

volumes:
  pgdata:
  frontend_node_modules:
