services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lu4
      POSTGRES_PASSWORD: lu4secret
      POSTGRES_DB: lu4
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lu4 -d lu4"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://lu4:lu4secret@db:5432/lu4
      WIKI_PATH: /data/wiki
      DATASETS_PATH: /data/datasets
      PYTHONPATH: /app
      DEV_RELOAD: "true"
    volumes:
      - ./data/wiki:/data/wiki:ro
      - ./data/datasets:/data/datasets:ro
      - ./data/raid-bosses:/data/raid-bosses:ro
      - ./data/media:/data/media
      - ./backend:/app
      - ./database:/database
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy
    command: ["/scripts/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/wiki:/data/wiki:ro
      - ./data/media:/data/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
