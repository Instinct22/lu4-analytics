resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
# API answers arrive from an upstream, so proxied responses must be compressed too.
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    client_max_body_size 20M;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Item/class icons live under data/wiki/images → /media/images/...
    # Icons are immutable per id; components bust the cache with ?v=ICON_VERSION.
    location /media/images/ {
        alias /data/wiki/images/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
    }
}
